<meta charset="utf-8">
<title>ClokeOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a full-screen desktop shell — wallpaper canvas, glass menubar on top, floating windows, dock at the bottom */
:root{
  --font-ui:"Figtree",-apple-system,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --accent:#7c5cff;
  --bg:#d9d0f0;
  --fg:#1e1a27; --fg-2:#6d6779; --fg-3:#9a94a6;
  --glass-o:.45;
  --tint:248,247,252; --win-rgb:251,250,253; --side-rgb:240,238,246; --page:#ffffff;
  --win:rgba(var(--win-rgb),min(.97,calc(var(--glass-o) + .42))); --win-bar:transparent;
  --win-side:rgba(var(--side-rgb),min(.92,calc(var(--glass-o) + .2))); --field:rgba(255,255,255,.72);
  --glass:rgba(var(--tint),var(--glass-o)); --glass-solid:rgba(var(--tint),min(.94,calc(var(--glass-o) + .32)));
  --pill:rgba(255,255,255,min(.85,calc(var(--glass-o) + .18)));
  --rim:rgba(255,255,255,.9); --rim-low:rgba(255,255,255,.35); --edge:rgba(30,20,60,.14);
  --menubar:transparent; --menubar-fg:#16131e; --menubar-shadow:0 0 8px rgba(255,255,255,.45);
  --line:rgba(40,25,70,.12); --line-strong:rgba(40,25,70,.22);
  --hover:rgba(40,25,70,.06); --hover-strong:rgba(40,25,70,.12);
  --light-off:#d6d2dc;
  --shadow:0 24px 64px rgba(25,12,50,.28),0 0 0 .5px rgba(25,12,50,.2);
  --pop-shadow:0 12px 36px rgba(25,12,50,.22),0 0 0 .5px rgba(25,12,50,.18);
  --term-bg:#17151c; --term-fg:#ebe8f0; --term-bar:#2a2731;
  --on-accent:#ffffff;
  --desk-label:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e0c14;
    --fg:#f1eef6; --fg-2:#aaa4b6; --fg-3:#777184;
    --tint:30,28,40; --win-rgb:30,28,37; --side-rgb:40,37,52; --page:#1c1a22; --field:rgba(0,0,0,.25);
    --pill:rgba(255,255,255,min(.22,calc(var(--glass-o) * .2 + .07)));
    --rim:rgba(255,255,255,.34); --rim-low:rgba(255,255,255,.1); --edge:rgba(0,0,0,.5);
    --menubar-fg:#f6f3fa; --menubar-shadow:0 1px 6px rgba(0,0,0,.35);
    --line:rgba(255,255,255,.1); --line-strong:rgba(255,255,255,.2);
    --hover:rgba(255,255,255,.06); --hover-strong:rgba(255,255,255,.13);
    --light-off:#4a4653;
    --shadow:0 24px 64px rgba(0,0,0,.55),0 0 0 .5px rgba(255,255,255,.12);
    --pop-shadow:0 12px 36px rgba(0,0,0,.5),0 0 0 .5px rgba(255,255,255,.14);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e0c14;
  --fg:#f1eef6; --fg-2:#aaa4b6; --fg-3:#777184;
  --tint:30,28,40; --win-rgb:30,28,37; --side-rgb:40,37,52; --page:#1c1a22; --field:rgba(0,0,0,.25);
  --pill:rgba(255,255,255,min(.22,calc(var(--glass-o) * .2 + .07)));
  --rim:rgba(255,255,255,.34); --rim-low:rgba(255,255,255,.1); --edge:rgba(0,0,0,.5);
  --menubar-fg:#f6f3fa; --menubar-shadow:0 1px 6px rgba(0,0,0,.35);
  --line:rgba(255,255,255,.1); --line-strong:rgba(255,255,255,.2);
  --hover:rgba(255,255,255,.06); --hover-strong:rgba(255,255,255,.13);
  --light-off:#4a4653;
  --shadow:0 24px 64px rgba(0,0,0,.55),0 0 0 .5px rgba(255,255,255,.12);
  --pop-shadow:0 12px 36px rgba(0,0,0,.5),0 0 0 .5px rgba(255,255,255,.14);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.38 var(--font-ui);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;cursor:default}
button{font:inherit;color:inherit;cursor:default}
input,textarea,select{font:inherit;color:inherit}
input,textarea{user-select:text;-webkit-user-select:text}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

#wall{position:fixed;inset:0;width:100%;height:100%}
#dim{position:fixed;inset:0;background:#000;pointer-events:none;z-index:9900;opacity:0;transition:opacity .2s}

/* ---------- boot / login / power ---------- */
.screen{position:fixed;inset:0;z-index:9800;display:flex;flex-direction:column;align-items:center;justify-content:center}
#boot,#power{background:#000;color:#fff}
.boot-c{display:flex;flex-direction:column;align-items:center;gap:56px}
.boot-logo{width:96px;height:96px;animation:fadeIn .9s ease-out}
.bar{width:200px;height:5px;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#fff;border-radius:3px}
.boot-hint{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom,0px));margin:0;font-size:12px;color:rgba(255,255,255,.38);text-align:center;padding-inline:16px}
#verbose{position:absolute;inset:0;margin:0;padding:16px max(16px,env(safe-area-inset-left,0px));font:12px/1.45 var(--font-mono);color:#d8d8d8;background:#000;overflow:hidden;white-space:pre-wrap;display:flex;flex-direction:column;justify-content:flex-end}
@keyframes fadeIn{from{opacity:0}}

#login{color:#fff;background:rgba(10,6,20,.18);backdrop-filter:blur(26px) saturate(1.3);-webkit-backdrop-filter:blur(26px) saturate(1.3);justify-content:space-between;padding:12vh 16px calc(32px + env(safe-area-inset-bottom,0px))}
.lg-time{text-align:center;text-shadow:0 2px 20px rgba(0,0,0,.25)}
#lg-date{font-size:20px;font-weight:600;opacity:.9}
#lg-clock{font-size:clamp(64px,13vw,120px);font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.lg-user{display:flex;flex-direction:column;align-items:center;gap:10px;margin:0}
.avatar{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;font-size:32px;font-weight:600;color:#fff;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.lg-name{font-size:17px;font-weight:600;text-shadow:0 1px 8px rgba(0,0,0,.3)}
.lg-field{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.22);border-radius:20px;padding:3px 3px 3px 14px;width:220px;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.35)}
.lg-field input{flex:1;min-width:0;background:none;border:0;outline:none;color:#fff;font-size:13px;height:24px}
.lg-field input::placeholder{color:rgba(255,255,255,.7)}
.lg-field button{width:24px;height:24px;border-radius:50%;border:0;background:rgba(255,255,255,.3);display:grid;place-items:center;padding:0}
.lg-hint{margin:2px 0 0;font-size:11.5px;opacity:.72;text-align:center}
.lg-user.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
.lg-power{display:flex;gap:28px}
.lg-power button{border:0;background:none;color:#fff;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;opacity:.85}
.lg-power button span{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center}
.lg-power button:hover span{background:rgba(255,255,255,.32)}
#power p{color:rgba(255,255,255,.55);margin:0 0 22px;font-size:14px}
#power button{width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:none;color:#fff;display:grid;place-items:center}
#power button:hover{background:rgba(255,255,255,.1)}

/* ---------- menubar ---------- */
#menubar{position:fixed;top:0;left:0;right:0;z-index:9000;height:26px;padding-top:env(safe-area-inset-top,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:1px;background:var(--menubar);backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);color:var(--menubar-fg);box-shadow:0 .5px 0 var(--line)}
.mb{height:22px;padding:0 9px;border:0;border-radius:5px;background:none;display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:13px}
.mb:hover,.mb.open{background:var(--hover-strong)}
.mb-logo svg{width:15px;height:15px}
.mb-app{font-weight:700}
#mb-menus{display:flex;gap:1px;min-width:0;overflow:hidden}
.mb-right{margin-left:auto;display:flex;align-items:center;gap:1px}
.mb-right svg{width:16px;height:16px}
#mb-clock{font-variant-numeric:tabular-nums}
.mb.off{opacity:.45}
@media (max-width:720px){#mb-menus,#mb-batt-txt{display:none}}

/* ---------- popover menus ---------- */
.pop{position:fixed;z-index:9500;min-width:220px;padding:5px;border-radius:10px;background:var(--glass-solid);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);box-shadow:var(--pop-shadow);color:var(--fg)}
.pop .mi{display:flex;width:100%;align-items:center;justify-content:space-between;gap:28px;border:0;background:none;padding:3px 10px;border-radius:5px;text-align:left;font-size:13px;line-height:20px;white-space:nowrap}
.pop .mi:hover:not([disabled]),.pop .mi:focus-visible{background:var(--accent);color:var(--on-accent);outline:none}
.pop .mi[disabled]{color:var(--fg-3)}
.pop .mi kbd{font:inherit;opacity:.55}
.pop .mi .ck{width:12px;display:inline-block}
.pop hr{border:0;height:1px;background:var(--line);margin:5px 9px}
.pop .mh{padding:3px 10px;font-size:11.5px;font-weight:600;color:var(--fg-3)}

/* ---------- desktop icons ---------- */
#desk-icons{position:fixed;top:36px;right:max(12px,env(safe-area-inset-right,0px));bottom:96px;left:max(12px,env(safe-area-inset-left,0px));display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,98px);grid-auto-columns:96px;justify-content:start;direction:rtl;gap:2px;pointer-events:none;z-index:1}
#desk-icons .item{pointer-events:auto;direction:ltr}
#desk-icons .item .lb{color:var(--desk-label);text-shadow:0 1px 3px rgba(0,0,0,.55)}
#desk-icons .item.sel .lb{text-shadow:none}

/* ---------- windows ---------- */
#windows{position:fixed;inset:0;z-index:2;pointer-events:none}
.win{position:absolute;pointer-events:auto;display:flex;flex-direction:column;background:var(--win);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;min-width:240px;min-height:150px;transform-origin:center}
.win.opening{animation:winIn .2s ease-out}
.win.anim{transition:left .28s cubic-bezier(.2,.8,.2,1),top .28s cubic-bezier(.2,.8,.2,1),width .28s cubic-bezier(.2,.8,.2,1),height .28s cubic-bezier(.2,.8,.2,1)}
.win.mini{transition:transform .34s cubic-bezier(.5,0,.75,0),opacity .34s;opacity:0}
@keyframes winIn{from{opacity:0;transform:scale(.94)}}
.titlebar{height:38px;flex:none;display:flex;align-items:center;gap:14px;padding:0 12px;background:var(--win-bar);border-bottom:1px solid var(--line);position:relative}
.wtitle{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;color:var(--fg-2);pointer-events:none;padding:0 120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win.active .wtitle{color:var(--fg)}
.lights{display:flex;gap:8px;z-index:1}
.lights button{width:12px;height:12px;border-radius:50%;border:0;padding:0;font-size:10px;line-height:12px;font-weight:700;color:transparent;display:grid;place-items:center}
.l-close{background:#ff5f57}.l-min{background:#febc2e}.l-zoom{background:#28c840}
.win:not(.active) .lights button{background:var(--light-off)}
.lights:hover button{color:rgba(0,0,0,.55)}
.win:not(.active) .lights:hover .l-close{background:#ff5f57}
.win:not(.active) .lights:hover .l-min{background:#febc2e}
.win:not(.active) .lights:hover .l-zoom{background:#28c840}
.tb-extra{display:flex;align-items:center;gap:4px;z-index:1;min-width:0}
.tb-right{margin-left:auto}
.tbb{height:26px;min-width:28px;padding:0 6px;border:0;border-radius:6px;background:none;color:var(--fg-2);display:grid;place-items:center}
.tbb:hover:not([disabled]){background:var(--hover-strong);color:var(--fg)}
.tbb[disabled]{opacity:.35}
.tbb svg{width:16px;height:16px}
.wbody{flex:1;min-height:0;display:flex;position:relative}
.rz{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;z-index:5}
.rz-r{position:absolute;right:0;top:38px;bottom:18px;width:6px;cursor:ew-resize;z-index:5}
.rz-b{position:absolute;left:0;right:18px;bottom:0;height:6px;cursor:ns-resize;z-index:5}
.win.dark-chrome .titlebar{background:var(--term-bar);border-color:#000}
.win.dark-chrome .wtitle{color:#a9a4b2}
.win.dark-chrome.active .wtitle{color:#e6e2ec}
.win.dark-chrome .tbb{color:#b8b3c1}

/* ---------- shared items ---------- */
.item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 4px;border:0;border-radius:8px;background:none;min-width:0}
.item .ic{width:58px;height:58px;padding:3px;border-radius:7px;box-sizing:border-box}
.item .ic svg{width:100%;height:100%}
.item .lb{font-size:12px;text-align:center;max-width:100%;overflow-wrap:anywhere;padding:1px 5px;border-radius:4px;line-height:1.25}
.item.sel .ic{background:var(--hover-strong)}
.item.sel .lb{background:var(--accent);color:var(--on-accent)}
.item.cut{opacity:.5}
.rn{width:100%;font-size:12px;text-align:center;border:1px solid var(--accent);border-radius:4px;padding:1px 3px;background:var(--field);outline:none;box-sizing:border-box}

/* ---------- Dateien (file manager) ---------- */
.fd{display:flex;flex:1;min-width:0}
.side{width:176px;flex:none;background:var(--win-side);border-right:1px solid var(--line);padding:8px 8px 12px;overflow:auto}
.side h4{font-size:11px;font-weight:700;color:var(--fg-3);margin:12px 8px 4px;letter-spacing:.03em}
.side h4:first-child{margin-top:4px}
.side .sb{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:4px 8px;border-radius:6px;text-align:left;font-size:13px}
.side .sb svg{width:16px;height:16px;flex:none;color:var(--accent)}
.side .sb:hover{background:var(--hover)}
.side .sb.on{background:var(--hover-strong)}
.fmain{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--win)}
.grid{flex:1;overflow:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));align-content:start;gap:4px;outline:none}
.status{height:26px;flex:none;border-top:1px solid var(--line);font-size:11.5px;color:var(--fg-2);display:flex;align-items:center;justify-content:center;gap:12px;background:var(--win-bar)}
.status button{border:0;background:none;color:var(--accent);font-weight:600;font-size:11.5px;padding:0 4px}
.empty{grid-column:1/-1;text-align:center;color:var(--fg-3);padding:48px 12px;font-size:13px}
@media (max-width:620px){.side{display:none}}

/* ---------- Terminal ---------- */
.term{flex:1;min-width:0;background:var(--term-bg);color:var(--term-fg);font:12.5px/1.5 var(--font-mono);padding:8px 12px 14px;overflow:auto;user-select:text;-webkit-user-select:text;cursor:text}
.tout>div{white-space:pre-wrap;word-break:break-word;min-height:1.5em}
.tline{display:flex;white-space:pre}
.tin{flex:1;min-width:0;background:none;border:0;outline:none;color:inherit;font:inherit;padding:0;caret-color:#b9a6ff}
.t-dir{color:#93b6ff;font-weight:600}.t-app{color:#c7a6ff;font-weight:600}.t-err{color:#ff8f8f}.t-ok{color:#9fe79f}.t-dim{color:#8b8695}.t-acc{color:#c9b8ff}.t-b{font-weight:600}
.t-blk{display:inline-block;width:2.2ch;height:1.1em;vertical-align:-2px}

/* ---------- Notizen ---------- */
.nt{display:flex;flex:1;min-width:0}
.nt-side{width:230px;flex:none;border-right:1px solid var(--line);background:var(--win-side);overflow:auto;padding:8px}
.nt-it{display:block;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:8px 10px;margin-bottom:2px}
.nt-it b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nt-it small{display:block;font-size:11.5px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nt-it small em{font-style:normal;color:var(--fg-3);margin-right:6px}
.nt-it:hover{background:var(--hover)}
.nt-it.on{background:#ffcf4a;color:#2b2210}
.nt-it.on small,.nt-it.on small em{color:#5c4d2a}
.nt-ed{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--win)}
.nt-date{font-size:11.5px;color:var(--fg-3);text-align:center;padding:10px 0 2px}
.nt-ta{flex:1;resize:none;border:0;outline:none;background:none;padding:10px 28px 24px;font-size:14px;line-height:1.6;color:var(--fg)}
.nt-ta::first-line{font-weight:700}
.nt-emp{flex:1;display:grid;place-items:center;color:var(--fg-3)}
@media (max-width:560px){.nt-side{width:150px}}

/* ---------- Rechner ---------- */
.calc{flex:1;display:flex;flex-direction:column;background:#29262e;color:#fff;padding:4px 10px 12px;outline:none}
.calc-d{flex:1;display:flex;align-items:flex-end;justify-content:flex-end;font-size:46px;font-weight:300;padding:0 6px 8px;font-variant-numeric:tabular-nums;overflow:hidden;white-space:nowrap;min-height:64px}
.calc-k{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.calc-k button{aspect-ratio:1;border:0;border-radius:50%;background:#54505b;color:#fff;font-size:20px;max-width:100%}
.calc-k button:active{filter:brightness(1.3)}
.calc-k .fn{background:#a7a2ad;color:#1d1b20}
.calc-k .op{background:#f59e2b}
.calc-k .op.on{background:#fff;color:#f59e2b}
.calc-k .zero{grid-column:span 2;aspect-ratio:auto;border-radius:40px;text-align:left;padding-left:22px}
.win.calc-win .titlebar{background:#29262e;border:0}

/* ---------- Kalender ---------- */
.cal{flex:1;display:flex;min-width:0}
.cal-main{flex:1;min-width:0;display:flex;flex-direction:column;padding:14px 16px}
.cal-h{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.cal-h h2{margin:0;font-size:22px;font-weight:700;text-wrap:balance}
.cal-h h2 span{font-weight:400;color:var(--fg-2)}
.cal-h .tbb{margin-left:auto}
.cal-g{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal-g .dh{font-size:11px;font-weight:700;color:var(--fg-3);text-align:right;padding:4px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.cal-g .dc{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:none;text-align:right;padding:4px 6px;display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-height:44px;overflow:hidden}
.cal-g .dc.out{color:var(--fg-3)}
.cal-g .dc.we{background:var(--hover)}
.cal-g .dc.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.cal-g .dc .n{font-size:13px;width:24px;height:24px;line-height:24px;text-align:center;border-radius:50%;font-variant-numeric:tabular-nums}
.cal-g .dc.today .n{background:#f0473f;color:#fff;font-weight:700}
.cal-g .dc .ev{font-size:10.5px;background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--fg);border-radius:3px;padding:0 4px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-side{width:210px;flex:none;border-left:1px solid var(--line);background:var(--win-side);padding:14px;display:flex;flex-direction:column;gap:10px;overflow:auto}
.cal-side h3{margin:0;font-size:14px}
.cal-side ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.cal-side li{display:flex;justify-content:space-between;gap:6px;background:var(--win);border-radius:6px;padding:6px 8px;font-size:12.5px}
.cal-side li button{border:0;background:none;color:var(--fg-3);padding:0}
.cal-side p{margin:0;color:var(--fg-3);font-size:12px}
.fld{width:100%;box-sizing:border-box;border:1px solid var(--line-strong);border-radius:6px;background:var(--field);padding:5px 8px;font-size:13px;outline:none}

/* ---------- Aktivitätsanzeige ---------- */
.act{flex:1;display:flex;flex-direction:column;min-width:0}
.act-t{flex:1;overflow:auto}
.act table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.act th{position:sticky;top:0;background:var(--win-bar);text-align:left;font-weight:600;color:var(--fg-2);padding:5px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.act td{padding:3px 10px;white-space:nowrap}
.act th.r,.act td.r{text-align:right}
.act tr:nth-child(even) td{background:var(--hover)}
.act tr.sel td{background:var(--accent);color:var(--on-accent)}
.act-f{flex:none;display:flex;align-items:center;gap:18px;border-top:1px solid var(--line);padding:10px 14px;background:var(--win-bar);font-size:12px;font-variant-numeric:tabular-nums}

.act-msg{font-size:12px;color:var(--fg-2);margin-right:6px}

/* ---------- Systemeinstellungen ---------- */
.st{display:flex;flex:1;min-width:0}
.st .side{width:200px}
.st-user{display:flex;align-items:center;gap:10px;padding:6px 8px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.st-user .avatar{width:38px;height:38px;font-size:16px;box-shadow:none}
.st-user b{display:block;font-size:13px}.st-user small{color:var(--fg-2);font-size:11.5px}
.st-main{flex:1;min-width:0;overflow:auto;padding:18px 24px 28px;display:flex;flex-direction:column;gap:18px}
.st-main h2{margin:0;font-size:19px;font-weight:700}
.grp{background:var(--win-side);border-radius:10px;border:1px solid var(--line)}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 14px;min-height:26px}
.row+.row{border-top:1px solid var(--line)}
.row span{color:var(--fg-2)}
.row .fld{max-width:220px}
.hero{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0 4px;text-align:center}
.hero svg{width:84px;height:84px}
.hero h1{margin:4px 0 0;font-size:26px;letter-spacing:-.01em}
.hero p{margin:0;color:var(--fg-2)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.opt{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0;font-size:12.5px}
.opt .pv{width:100%;aspect-ratio:16/10;border-radius:8px;box-shadow:0 0 0 1px var(--line-strong);overflow:hidden;position:relative}
.opt.on .pv{box-shadow:0 0 0 3px var(--accent)}
.opt canvas{width:100%;height:100%;display:block}
.pv-l{background:linear-gradient(135deg,#d8cdf7,#f6dbe9)}.pv-d{background:linear-gradient(135deg,#1b1330,#3b1840)}.pv-a{background:linear-gradient(135deg,#d8cdf7 50%,#1b1330 50%)}
.pv i{position:absolute;left:14%;top:22%;width:58%;height:52%;border-radius:5px}
.pv-l i{background:#fbfafd}.pv-d i{background:#2b2833}.pv-a i{background:linear-gradient(135deg,#fbfafd 50%,#2b2833 50%)}
.sw-row{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:22px;height:22px;border-radius:50%;border:0;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.swatch.on{box-shadow:0 0 0 2px var(--win),0 0 0 4px var(--fg-3)}
.tgl{appearance:none;-webkit-appearance:none;width:34px;height:20px;border-radius:10px;background:var(--line-strong);position:relative;margin:0;flex:none;transition:background .15s}
.tgl::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.tgl:checked{background:var(--accent)}
.tgl:checked::after{transform:translateX(14px)}
input[type=range]{accent-color:var(--accent);width:180px;max-width:100%}
.btn{border:0;border-radius:6px;padding:5px 12px;background:var(--hover-strong);font-size:13px}
.btn:hover{filter:brightness(1.05)}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.note{font-size:12px;color:var(--fg-2);margin:0;line-height:1.5;max-width:62ch}

/* ---------- Über ClokeOS ---------- */
.about{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 24px 22px;text-align:center}
.about svg{width:76px;height:76px;margin-bottom:6px}
.about h1{margin:0;font-size:24px;letter-spacing:-.01em}
.about .ver{color:var(--fg-2);margin:0 0 12px}
.about dl{margin:0 0 14px;display:grid;grid-template-columns:auto auto;gap:3px 12px;font-size:12px;text-align:left}
.about dt{text-align:right;font-weight:600}.about dd{margin:0;color:var(--fg-2)}

/* ---------- dock ---------- */
#dock{--ds:50px;position:fixed;left:50%;bottom:calc(6px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:8000;display:flex;align-items:flex-end;gap:5px;height:calc(var(--ds) + 10px);box-sizing:border-box;padding:5px 7px;border-radius:calc(var(--ds) * .36 + 5px);background:var(--glass);backdrop-filter:blur(26px) saturate(1.8);-webkit-backdrop-filter:blur(26px) saturate(1.8);box-shadow:inset 0 0 0 .5px var(--line-strong),0 10px 34px rgba(0,0,0,.2);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-width:calc(100vw - 16px)}
#dock.hide{transform:translate(-50%,calc(100% + 16px))}
.dk{position:relative;flex:none;width:var(--ds);height:var(--ds);border:0;padding:0;background:none;transition:width .1s,height .1s}
.dk svg{width:100%;height:100%}
.dk .dot{position:absolute;bottom:-4.5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--fg);opacity:0}
.dk.run .dot{opacity:.7}
.dk .tip{position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%);background:var(--glass-solid);color:var(--fg);padding:3px 10px;border-radius:6px;font-size:12.5px;white-space:nowrap;box-shadow:var(--pop-shadow);opacity:0;pointer-events:none;transition:opacity .1s}
.dk:hover .tip{opacity:1}
.dk.bounce{animation:bounce .55s ease-in-out 2}
@keyframes bounce{50%{transform:translateY(-18px)}}
.dk-sep{width:1px;align-self:stretch;margin:2px 3px;background:var(--line-strong);flex:none}
@media (max-width:600px){#dock{gap:3px;padding:5px}}

/* ---------- launchpad ---------- */
#launchpad{position:fixed;inset:0;z-index:8500;background:rgba(20,12,36,.35);backdrop-filter:blur(36px) saturate(1.4);-webkit-backdrop-filter:blur(36px) saturate(1.4);display:flex;flex-direction:column;align-items:center;padding:calc(48px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 120px max(16px,env(safe-area-inset-left,0px));animation:lpIn .22s ease-out;overflow:auto}
@keyframes lpIn{from{opacity:0;transform:scale(1.06)}}
#lp-q{width:240px;max-width:100%;height:28px;border-radius:8px;border:0;background:rgba(255,255,255,.2);color:#fff;text-align:center;outline:none;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.35);margin-bottom:44px}
#lp-q::placeholder{color:rgba(255,255,255,.7)}
.lp-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:28px 18px;width:min(900px,100%)}
.lp-g button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:8px;color:#fff;font-size:13px;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.lp-g button svg{width:76px;height:76px;transition:transform .15s}
.lp-g button:hover svg{transform:scale(1.06)}

/* ---------- spotlight ---------- */
#spot{position:fixed;z-index:9600;top:22vh;left:50%;transform:translateX(-50%);width:min(620px,calc(100vw - 32px));border-radius:14px;background:var(--glass-solid);backdrop-filter:blur(36px) saturate(1.6);-webkit-backdrop-filter:blur(36px) saturate(1.6);box-shadow:var(--pop-shadow);overflow:hidden}
.sp-in{display:flex;align-items:center;gap:10px;padding:0 16px;height:54px}
.sp-in svg{width:22px;height:22px;color:var(--fg-2);flex:none}
#sp-q{flex:1;min-width:0;border:0;background:none;outline:none;font-size:22px;color:var(--fg)}
#sp-r{border-top:1px solid var(--line);padding:6px;max-height:50vh;overflow:auto}
#sp-r:empty{display:none}
.sp-h{font-size:11px;font-weight:700;color:var(--fg-3);padding:6px 10px 3px}
.sp-it{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;border-radius:8px;padding:5px 10px;text-align:left}
.sp-it svg{width:28px;height:28px;flex:none}
.sp-it b{font-weight:500;font-size:14px}
.sp-it small{color:var(--fg-3);font-size:11.5px;margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sp-it.on{background:var(--accent);color:var(--on-accent)}
.sp-it.on small{color:inherit;opacity:.8}

/* ---------- control center ---------- */
.cc{width:300px;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cc-t{background:var(--hover);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;box-shadow:inset 0 0 0 .5px var(--line)}
.cc-w{grid-column:span 2}
.cc-t label{font-size:12px;font-weight:600}
.cc-b{display:flex;align-items:center;gap:9px;border:0;background:none;padding:0;text-align:left;font-size:12.5px}
.cc-b i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--hover-strong);flex:none}
.cc-b i svg{width:15px;height:15px}
.cc-b.on i{background:var(--accent);color:var(--on-accent)}
.cc-b small{display:block;color:var(--fg-2);font-size:11px}
.cc-t input[type=range]{width:100%}

/* ---------- notifications ---------- */
#notifs{position:fixed;top:34px;right:max(10px,env(safe-area-inset-right,0px));z-index:9400;display:flex;flex-direction:column;gap:8px;width:min(340px,calc(100vw - 20px));pointer-events:none}
.nf{pointer-events:auto;display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:14px;background:var(--glass-solid);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);box-shadow:var(--pop-shadow);animation:nfIn .35s cubic-bezier(.2,.8,.2,1)}
.nf svg{width:34px;height:34px;flex:none}
.nf b{display:block;font-size:13px}
.nf p{margin:1px 0 0;font-size:12.5px;color:var(--fg-2)}
.nf.out{transition:opacity .3s,transform .3s;opacity:0;transform:translateX(30px)}
@keyframes nfIn{from{opacity:0;transform:translateX(40px)}}

#svgdefs{position:absolute;width:0;height:0;overflow:hidden}

/* ================= Liquid Glass layer ================= */
/* glass = translucent tint + heavy blur + specular rim (inset highlights + gradient ring) */
.win,#dock,.pop,#spot,.nf,#launchpad #lp-q,.lg-field{
  --rim-shadow:inset 0 1px 0 var(--rim),inset 0 -1px 0 var(--rim-low),inset 0 0 0 .5px var(--rim-low);
}
.win::before,#dock::before,.pop::before,#spot::before,.nf::before{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:20;
  background:linear-gradient(140deg,var(--rim) 0%,rgba(255,255,255,0) 32%,rgba(255,255,255,0) 68%,var(--rim-low) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
}
.nf{position:relative}
.win{background:var(--win);backdrop-filter:blur(44px) saturate(1.9);-webkit-backdrop-filter:blur(44px) saturate(1.9);border-radius:13px;box-shadow:var(--rim-shadow),0 0 0 .5px var(--edge),0 28px 70px rgba(10,5,30,.32)}
.win:not(.active){box-shadow:var(--rim-shadow),0 0 0 .5px var(--edge),0 14px 36px rgba(10,5,30,.2)}
.titlebar{height:42px;background:transparent;border-bottom:0;gap:12px}
.fd .side,.st .side,.nt-side,.cal-side{background:var(--win-side);border-color:var(--line)}
.fmain,.nt-ed{background:transparent}
.status{background:transparent}
.pill{display:flex;align-items:center;gap:1px;padding:2px;border-radius:999px;background:var(--pill);box-shadow:var(--rim-shadow),0 1px 4px rgba(0,0,0,.08)}
.pill .tbb{border-radius:999px;min-width:30px}
.tb-extra.tb-right{gap:8px}
.win.dark-chrome{--rim:rgba(255,255,255,.28);--rim-low:rgba(255,255,255,.08)}
.win.dark-chrome,.win.dark-chrome .titlebar{background:transparent}
.win.dark-chrome{background:rgba(22,20,28,min(.95,calc(var(--glass-o) + .4)))}
.term{background:transparent}
.calc{background:transparent}
.win.calc-win .titlebar{background:transparent}
.calc-k button{background:rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.22);backdrop-filter:blur(6px)}
.calc-k .fn{background:rgba(255,255,255,.55);color:#1d1b20}
.calc-k .op{background:#f59e2b;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.act th{background:var(--win)}
.act-f{background:transparent}
.grp{background:var(--pill);border:0;box-shadow:var(--rim-shadow),0 0 0 .5px var(--edge)}
.btn{background:var(--pill);box-shadow:var(--rim-shadow),0 0 0 .5px var(--edge);border-radius:999px;padding:5px 14px}
.btn.pri{background:var(--accent);color:var(--on-accent);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.fld{background:var(--field);border-radius:8px}

#menubar{background:transparent;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;height:28px;text-shadow:var(--menubar-shadow)}
.mb{height:22px;border-radius:999px;padding:0 10px}
.mb:hover,.mb.open{background:var(--pill);box-shadow:var(--rim-shadow);text-shadow:none}

#dock{background:var(--glass);backdrop-filter:blur(18px) saturate(1.9) brightness(1.04);-webkit-backdrop-filter:blur(18px) saturate(1.9) brightness(1.04);border-radius:calc(var(--ds) * .42 + 6px);box-shadow:var(--rim-shadow),0 0 0 .5px var(--edge),0 14px 40px rgba(10,5,30,.25);padding:6px 8px;height:calc(var(--ds) + 12px)}
.refract #dock{backdrop-filter:url(#lg-refract) blur(5px) saturate(1.9) brightness(1.04)}
.dk .tip{border-radius:999px;background:var(--glass-solid);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:var(--rim-shadow),var(--pop-shadow)}
.dk .dot{background:var(--fg);bottom:-5px}

.pop{background:var(--glass-solid);border-radius:14px;padding:6px;backdrop-filter:blur(40px) saturate(1.9);-webkit-backdrop-filter:blur(40px) saturate(1.9);box-shadow:var(--rim-shadow),0 0 0 .5px var(--edge),var(--pop-shadow)}
.pop .mi{border-radius:8px;padding:3px 12px}
.cc{width:310px}
.cc-t{background:var(--pill);border-radius:18px;box-shadow:var(--rim-shadow)}
#spot{border-radius:26px;background:var(--glass-solid);box-shadow:var(--rim-shadow),0 0 0 .5px var(--edge),var(--pop-shadow)}
.sp-in{height:56px;padding:0 20px}
.sp-it{border-radius:12px}
.nf{border-radius:18px;background:var(--glass-solid);box-shadow:var(--rim-shadow),0 0 0 .5px var(--edge),var(--pop-shadow)}
#launchpad{background:rgba(20,14,36,.22)}
#lp-q{border-radius:999px;background:rgba(255,255,255,.18);box-shadow:var(--rim-shadow)}
.lg-field{background:rgba(255,255,255,.18);box-shadow:var(--rim-shadow)}
#login{background:rgba(10,6,20,.08);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4)}
.item.sel .ic{background:var(--pill);box-shadow:var(--rim-shadow)}

/* ---------- Search (browser) ---------- */
.win.browser .wtitle{display:none}
.win.browser .tb-extra{flex:1;gap:10px}
.addr{flex:1;min-width:0;max-width:560px;margin:0 auto;height:30px;border:0;border-radius:999px;background:var(--pill);box-shadow:var(--rim-shadow),0 0 0 .5px var(--edge);text-align:center;padding:0 16px;font-size:13px;outline:none;color:var(--fg)}
.addr:focus{text-align:left;box-shadow:var(--rim-shadow),0 0 0 2px var(--accent)}
.addr::placeholder{color:var(--fg-3)}
.br{flex:1;display:flex;flex-direction:column;min-width:0}
.br-tabs{display:flex;gap:6px;padding:0 10px 8px;overflow-x:auto;flex:none}
.br-tab{flex:1 1 0;min-width:96px;max-width:240px;display:flex;align-items:center;gap:6px;height:28px;padding:0 4px 0 12px;border:0;border-radius:999px;background:transparent;font-size:12px;color:var(--fg-2)}

.wp{max-width:720px;margin:0 auto;padding:34px 28px 56px;font-size:15px;line-height:1.65;color:var(--fg)}

.res{margin:0 0 22px}
.res .u{font-size:12px;color:var(--fg-3)}
.res h3{margin:2px 0 4px;font-size:17px;font-weight:600}

    const up = Math.floor((Date.now() - bootTime) / 1000); $('.a-up', win.body).textContent = `${Math.floor(up / 60)}:${String(up % 60).padStart(2, '0')}`;

    ctx.beginPath(); hist.forEach((v, i) => { const x = i / (hist.length - 1) * W, yy = H - v / 100 * (H - 4) - 2; i ? ctx.lineTo(x, yy) : ctx.moveTo(x, yy); });

  }
  tb.onclick = e => { const tr = e.target.closest('tr'); if (!tr) return; sel = +tr.dataset.pid; $$('tr', tb).forEach(r => r.classList.toggle('sel', r === tr)); msg.textContent = ''; };
  win.extra.onclick = e => {
    if (!e.target.closest('[data-a=kill]')) return;

    const p = procList().find(x => x[1] === sel);
    if (!p) return;
    if (!p[6]) { msg.textContent = `„${p[0]}" ist ein Systemprozess und läuft weiter.`; return; }
    if (p[6] === 'aktivitaet') { closeWin(win); return; }

}
