# Wie xorg.conf, aber mit ClokeOS' eigenem Grafiktreiber clokeintel (xdriver/clokeintel) statt puredarwingop.
# cloakserver-xorg nimmt diese Datei, wenn kext/ClokeIntelGfx den Bildschirm betreibt (/dev/clokeos_fb).
Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoAddGPU"     "false"
    Option "AutoEnableDevices" "false"
    Option "DontVTSwitch"   "true"
    Option "AllowEmptyInput" "true"
EndSection

Section "Device"
    Identifier "GOP0"
    Driver     "clokeintel"
EndSection

Section "Monitor"
    Identifier "Monitor0"
EndSection

Section "Screen"
    Identifier "Screen0"
    Device     "GOP0"
    Monitor    "Monitor0"
    DefaultDepth 24
EndSection

Section "InputDevice"
    Identifier "Mouse0"
    Driver     "puredarwininput"
    Option     "PDType" "mouse"
    Option     "Device" "/dev/usb_hid_mouse"
EndSection

Section "InputDevice"
    Identifier "Keyboard0"
    Driver     "puredarwininput"
    Option     "PDType" "keyboard"
    Option     "Device" "/dev/usb_hid_kbd"
EndSection

Section "InputDevice"
    Identifier "Mouse1"
    Driver     "puredarwininput"
    Option     "PDType" "mouse"
    Option     "Device" "/dev/clokeos_mouse"
EndSection

Section "InputDevice"
    Identifier "Mouse2"
    Driver     "puredarwininput"
    Option     "PDType" "mouse"
    Option     "Device" "/dev/clokeos_touchpad"
EndSection

Section "InputDevice"
    Identifier "Keyboard1"
    Driver     "puredarwininput"
    Option     "PDType" "keyboard"
    Option     "Device" "/dev/clokeos_kbd"
EndSection

Section "ServerLayout"
    Identifier "Layout0"
    Screen     "Screen0"
    InputDevice "Mouse0" "CorePointer"
    InputDevice "Keyboard0" "CoreKeyboard"
    InputDevice "Mouse1" "SendCoreEvents"
    InputDevice "Mouse2" "SendCoreEvents"
    InputDevice "Keyboard1" "SendCoreEvents"
EndSection
